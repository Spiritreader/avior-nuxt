name: CI

on:
  # Build the image whenever master changes. The previous trigger was
  # pull_request[closed] + "merged == true", which never fired for a direct
  # push and could not be run manually either (the condition is false for
  # workflow_dispatch). This repository deploys via ghcr.io, so that is what
  # gets pushed; Docker Hub is no longer referenced by compose.yaml or README.
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          # ghcr.io requires a lowercase repository path
          build-args: "COMMIT=${{ github.sha }}"
          push: true
          tags: ghcr.io/spiritreader/avior-nuxt:latest
